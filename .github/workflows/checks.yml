name: Code Quality Checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install check tools
        run: pip install bandit detect-secrets flake8

      - name: Flake8 (informational)
        run: flake8 .
        continue-on-error: true

      - name: detect-secrets (informational)
        run: detect-secrets scan --all-files
        continue-on-error: true

      - name: Bandit (blocking)
        run: bandit -r . -x ./.git
